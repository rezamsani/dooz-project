apply plugin: 'com.android.application'

def settingsFile = rootProject.file('../appsettings.json')
def billing = [:]
if (settingsFile.exists()) {
    try {
        def settings = new groovy.json.JsonSlurper().parseText(settingsFile.getText('UTF-8').replaceFirst('^\uFEFF', ''))
        if (!(settings instanceof Map)) throw new IllegalArgumentException()
        billing = settings.android?.billing ?: [:]
        if (!(billing instanceof Map)) throw new IllegalArgumentException()
    } catch (Exception ignored) {
        throw new GradleException('Read the Android billing settings from a valid appsettings.json file.')
    }
}

def billingKey = { String store, String name ->
    def configured = billing[store]?.publicKey ?: ''
    def override = providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrNull()
    def key = override == null ? configured : override
    if (!(key instanceof String) || (key.trim() && !(key.trim() ==~ /[A-Za-z0-9+\/=]+/))) {
        throw new GradleException("android.billing.${store}.publicKey must be a Base64 public key")
    }
    return key.trim()
}
def myketKey = billingKey('myket', 'DOOZ_MYKET_BILLING_PUBLIC_KEY')
def bazaarKey = billingKey('bazaar', 'DOOZ_BAZAAR_BILLING_PUBLIC_KEY')
def productId = billing.productId ?: 'dooz_twelve_unlock'
if (!(productId instanceof String) || !(productId ==~ /[a-z0-9_.]+/)) {
    throw new GradleException('android.billing.productId must contain only lowercase letters, digits, underscores or periods')
}

android {
    namespace = "ir.dooz.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ir.dooz.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'BILLING_PRODUCT_ID', '"' + productId + '"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'store'
    productFlavors {
        standalone {
            dimension 'store'
            isDefault = true
        }
        myket {
            dimension 'store'
            manifestPlaceholders = [marketApplicationId: 'ir.mservices.market',
                marketBindAddress: 'ir.mservices.market.InAppBillingService.BIND',
                marketPermission: 'ir.mservices.market.BILLING']
            buildConfigField 'String', 'BILLING_PUBLIC_KEY', '"' + myketKey + '"'
        }
        bazaar {
            dimension 'store'
            manifestPlaceholders = [marketApplicationId: 'com.farsitel.bazaar',
                marketBindAddress: 'ir.cafebazaar.pardakht.InAppBillingService.BIND',
                marketPermission: 'com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR']
            buildConfigField 'String', 'BILLING_PUBLIC_KEY', '"' + bazaarKey + '"'
        }
    }
    sourceSets {
        myket.java.srcDir 'src/store/java'
        bazaar.java.srcDir 'src/store/java'
    }
}

['Myket': myketKey, 'Bazaar': bazaarKey].each { store, key ->
    tasks.matching { it.name == "pre${store}ReleaseBuild" }.configureEach {
        doFirst {
            if (!key) throw new GradleException("Set android.billing.${store.toLowerCase(java.util.Locale.ROOT)}.publicKey in appsettings.json before building the store release")
        }
    }
}

repositories {
    maven {
        url 'https://maven.myket.ir'
        content { includeGroup 'ir.myket' }
    }
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    myketImplementation 'ir.myket:billing:2.2'
    bazaarImplementation 'ir.myket:billing:2.2'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
