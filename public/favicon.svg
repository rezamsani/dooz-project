<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#0D3B3E" />
      <stop offset="100%" stop-color="#0B1623" />
    </linearGradient>
    <linearGradient id="winGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <radialGradient id="tealGem" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="45%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0F766E" />
    </radialGradient>
    <radialGradient id="rubyGem" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="45%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#BE123C" />
    </radialGradient>
  </defs>

  <!-- Outer rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="2" />

  <!-- Subtle Dooz/Morris board grid -->
  <rect x="14" y="14" width="36" height="36" rx="4" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="2.5" />
  <line x1="32" y1="14" x2="32" y2="50" stroke="#5EEAD4" stroke-opacity="0.28" stroke-width="2.2" />
  <line x1="14" y1="32" x2="50" y2="32" stroke="#5EEAD4" stroke-opacity="0.28" stroke-width="2.2" />

  <!-- Winning diagonal line -->
  <line x1="17" y1="17" x2="47" y2="47" stroke="url(#winGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Opponent ruby pieces -->
  <circle cx="47" cy="17" r="5.5" fill="url(#rubyGem)" stroke="#0B1623" stroke-width="1.5" />
  <circle cx="17" cy="47" r="5.5" fill="url(#rubyGem)" stroke="#0B1623" stroke-width="1.5" />

  <!-- Winning turquoise pieces -->
  <circle cx="17" cy="17" r="6" fill="url(#tealGem)" stroke="#FEF3C7" stroke-width="1.5" />
  <circle cx="32" cy="32" r="6.5" fill="url(#tealGem)" stroke="#FEF3C7" stroke-width="1.5" />
  <circle cx="47" cy="47" r="6" fill="url(#tealGem)" stroke="#FEF3C7" stroke-width="1.5" />
</svg>
